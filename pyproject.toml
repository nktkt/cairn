[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cairn"
version = "0.1.0"
description = "Static AI training plan compiler and validator"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Cairn contributors" }]
license = { text = "MIT" }
dependencies = []

[project.scripts]
cairn = "cairn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
