name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Check generated op registry
        run: python tools/generate_op_registry.py --check
      - name: Build runtime smoke binary
        run: >-
          cc -std=c11 -Wall -Wextra -Werror
          -I runtime/include
          runtime/src/cairn.c
          runtime/examples/smoke.c
          -o /tmp/cairn-runtime-smoke
      - name: Build runtime restore binary
        run: >-
          cc -std=c11 -Wall -Wextra -Werror
          -I runtime/include
          runtime/src/cairn.c
          runtime/examples/restore.c
          -o /tmp/cairn-runtime-restore
      - name: Validate example bundle
        run: >-
          PYTHONPATH=src python -m cairn validate
          --model examples/small/model.json
          --training examples/small/training.json
          --topology examples/small/topology.json
          --dataset examples/small/dataset.json
          --checkpoint examples/small/checkpoint.json
      - name: Compile and simulate example plan
        run: |
          PYTHONPATH=src python -m cairn compile \
            --model examples/small/model.json \
            --training examples/small/training.json \
            --topology examples/small/topology.json \
            --dataset examples/small/dataset.json \
            --checkpoint examples/small/checkpoint.json \
            --out build/plan
          PYTHONPATH=src python -m cairn simulate build/plan --out build/simulation-report.json
          PYTHONPATH=src python -m cairn report build/simulation-report.json
          /tmp/cairn-runtime-smoke build/plan/ranks/rank_000000.json 8 /tmp/cairn-checkpoints
          /tmp/cairn-runtime-restore build/plan/ranks/rank_000000.json 8 /tmp/cairn-checkpoints
